name: Verify AIU news

on:
  pull_request:
    paths:
      - 'news/**'
      - 'scripts/**'
      - 'components/NewsUpdateSection.tsx'
  push:
    branches: [main]
    paths:
      - 'news/**'
      - 'scripts/**'
      - 'components/NewsUpdateSection.tsx'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site and news data
        run: npm run build

      - name: Confirm generated news data is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('public/data/aiu-news.json')); JSON.parse(require('fs').readFileSync('public/data/aiu-news.ko.json'))"

# Social posting intentionally does not run here. Student B Publisher sends
# each platform request once and records partial failures locally.
